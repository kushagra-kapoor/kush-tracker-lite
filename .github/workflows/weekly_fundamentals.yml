name: Weekly Fundamentals Sync

on:
  schedule:
    - cron: '0 20 * * 5' # 4 AM SGT on Saturday (20:00 UTC Friday)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_fundamentals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Streamlit Secrets (Turso Connection)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          mkdir -p .streamlit
          cat << EOF > .streamlit/secrets.toml
          [database]
          db_type = "turso"
          turso_url = "${TURSO_URL}"
          turso_token = "${TURSO_TOKEN}"
          EOF
          
      - name: Debug Fundamentals Cache
        run: |
          python -c "
          import sys; sys.path.append('.')
          from database import get_connection, _fetch_all_dicts
          conn = get_connection()
          c = conn.cursor()
          c.execute(\"SELECT * FROM fundamentals_cache WHERE ticker LIKE '%RELIANCE%' LIMIT 5\")
          print('--- DEBUG CACHE ---')
          for r in _fetch_all_dicts(c): print(r)
          "
          
      - name: Run Cloud Fundamentals Sync Engine
        run: python sync_fundamentals.py
