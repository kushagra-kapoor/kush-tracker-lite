name: Weekly Ticker Universe Sync

on:
  schedule:
    - cron: '0 1 * * 6' # 1:00 AM UTC every Saturday (early Saturday morning before market opens on Monday)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_tickers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3
          
      - name: Run Ticker Sync Engine
        run: python sync_tickers.py
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers.txt tickers_us.txt
          
          # Only commit if there are actually changes to the ticker files
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update global ticker universe (IPO additions/delistings)" && git push)
