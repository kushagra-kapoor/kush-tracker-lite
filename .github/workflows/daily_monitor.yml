name: Daily Intraday Monitor & AI Briefing

on:
  schedule:
    # Runs at 10:15 AM UTC (3:45 PM IST) every Monday through Friday
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  daily_monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Streamlit Secrets (Turso Connection)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          mkdir -p .streamlit
          cat << EOF > .streamlit/secrets.toml
          [database]
          db_type = "turso"
          turso_url = "${TURSO_URL}"
          turso_token = "${TURSO_TOKEN}"
          EOF
          
      - name: Run Headless Daily Monitor
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python daily_monitor.py
