name: Daily Sync

on:
  schedule:
    - cron: '0 20 * * *' # 4 AM SGT (UTC+8)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Streamlit Secrets (Turso Connection)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          mkdir -p .streamlit
          cat << EOF > .streamlit/secrets.toml
          [database]
          db_type = "turso"
          turso_url = "${TURSO_URL}"
          turso_token = "${TURSO_TOKEN}"
          EOF
          
      - name: Run Global Macro Sync
        run: python sync_macro.py
        
      - name: Run Cloud Fundamentals Sync Engine
        run: python sync_fundamentals.py
