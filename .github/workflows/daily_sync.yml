name: Daily Sync

on:
  schedule:
    - cron: '25 21 * * 1-5' # 21:25 UTC = 5:25 AM SGT Tue-Sat (after US 16:00 close settles year-round)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Setup Streamlit Secrets (Turso Connection)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          mkdir -p .streamlit
          cat << EOF > .streamlit/secrets.toml
          [database]
          db_type = "turso"
          turso_url = "${TURSO_URL}"
          turso_token = "${TURSO_TOKEN}"
          EOF
          
      - name: Patch Database Schema
        run: python patch_db.py
        
      - name: Run Global Macro Sync
        run: python sync_macro.py
